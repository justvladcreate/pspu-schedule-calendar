name: Deploy to GitHub Pages

# Код живёт в main, данные — в ветке data (её обновляет парсер).
# Здесь они собираются вместе: main даёт сайт, data — web/data.
# Пуш в data не может деплоить сам (у окружения github-pages политика
# «только main»), поэтому он запускает этот воркфлоу через
# workflow_dispatch — см. dispatch-pages.yml.

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'tools/bump-sw.mjs'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code (main)
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Checkout data branch
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: data
          path: .data-src

      - name: Attach data
        run: |
          if [ -d .data-src/web/data ]; then
            rm -rf web/data
            mkdir -p web
            cp -R .data-src/web/data web/data
            echo "Данные: $(find web/data -type f | wc -l) файлов"
          else
            echo "Ветки data нет — собираю только код"
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Bump service worker version
        run: node tools/bump-sw.mjs --root web

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
