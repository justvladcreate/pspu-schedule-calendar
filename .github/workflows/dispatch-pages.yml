name: Rebuild pages after data update

# Эту ветку (data) обновляет парсер. У окружения github-pages политика
# «деплой только с main», поэтому пуш сюда не деплоит напрямую, а
# запускает Deploy to GitHub Pages на main через workflow_dispatch.
#
# Файл лежит и в main (для истории), но срабатывает только в data —
# именно эту копию парсер кладёт в ветку данных.

on:
  push:
    branches: [data]

permissions:
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Deploy to GitHub Pages on main
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'deploy-pages.yml',
              ref: 'main',
            });
