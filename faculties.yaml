# Реестр факультетов и источников расписания.
#
# Добавить факультет:
#   1) создать parser/faculties/<id>_<имя>/parser.py с наследником FacultyParser;
#   2) зарегистрировать его в parser/faculties/__init__.py;
#   3) добавить запись сюда.
#
# source.type:
#   google_sheets — чтение через Google Sheets API (нужны креды);
#   cloud_mail    — публичная ссылка cloud.mail.ru на XLSX;
#   google_drive  — экспорт Google-таблицы в XLSX по spreadsheet_id.
#
# prompt — имя профиля промпта внутри модуля факультета.

academic:
  year: "2026/2027"
  semester_start: "01.09.2026"
  semester_end: "23.01.2027"

faculties:
  # Эталон: старая проверенная схема с LLM.
  - id: "12"
    name: "Информатики и экономики"
    short: "ИНЭК"
    source:
      type: google_sheets
      spreadsheet_id: "1_fsm-OxH9E9LgHnLC0iju5OlaHIv0agmM87GLvRKIAg"
    prompt: inec
    enabled: true

  # Первый XLSX-факультет, разбор пока детерминированный.
