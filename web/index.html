<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Расписание</title>
    <link rel="stylesheet" href="style.css?v=20260916-11">
</head>
<body>
<div class="app">
    <button class="warning-banner" id="warningBanner" type="button">
        <span class="warning-icon" aria-hidden="true">ⓘ</span>
        <span class="warning-text">
            Расписание может <span class="warning-underline">значительно отличаться</span>
            от реального варианта — нет ручной ревизии
        </span>
        <span class="warning-arrow" aria-hidden="true">→</span>
    </button>

    <header class="toolbar">
        <div class="toolbar-left">
            <div class="date-label" id="dateLabel" role="button" tabindex="0"></div>
        </div>

        <div class="toolbar-center">
            <button class="btn btn-arrow" id="prevBtn" type="button" aria-label="Назад"></button>
            <button class="btn" id="todayBtn" type="button">Сегодня</button>
            <button class="btn btn-arrow" id="nextBtn" type="button" aria-label="Вперёд"></button>
        </div>

        <div class="toolbar-right">
            <div class="filter" id="filterRoot">
                <button class="btn btn-icon filter-trigger" type="button" aria-label="Фильтр">
                    <svg class="icon" viewBox="0 0 24 24" width="18" height="18"
                         fill="none" stroke="currentColor" stroke-width="2"
                         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/>
                    </svg>
                    <span class="filter-badge" aria-hidden="true"></span>
                </button>
                <div class="filter-dropdown">
                    <div class="filter-mobile-header">
                        <span class="filter-mobile-title">Фильтр</span>
                        <button class="filter-close" type="button" aria-label="Закрыть">✕</button>
                    </div>
                    <input type="text" class="filter-search" placeholder="Поиск по группам и преподавателям...">
                    <div class="filter-columns">
                        <div class="filter-column">
                            <div class="filter-column-title">Группы</div>
                            <div class="filter-options" id="filterGroupsList"></div>
                        </div>
                        <div class="filter-column">
                            <div class="filter-column-title">Преподаватели</div>
                            <div class="filter-options" id="filterTeachersList"></div>
                        </div>
                    </div>
                    <div class="filter-footer">
                        <span class="filter-counter" id="filterCounter"></span>
                        <button class="filter-clear" type="button">Сбросить всё</button>
                    </div>
                </div>
            </div>

            <button class="btn btn-icon" id="viewBtn" type="button"
                    data-view="week" aria-label="Переключить вид">
                <svg class="icon view-icon view-icon-month" viewBox="0 0 24 24" width="18" height="18"
                     fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <rect x="3" y="3" width="7" height="7"/>
                    <rect x="14" y="3" width="7" height="7"/>
                    <rect x="3" y="14" width="7" height="7"/>
                    <rect x="14" y="14" width="7" height="7"/>
                </svg>
                <svg class="icon view-icon view-icon-week" viewBox="0 0 24 24" width="18" height="18"
                     fill="none" stroke="currentColor" stroke-width="1.8"
                     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <rect x="2" y="5" width="4" height="14" rx="1"/>
                    <rect x="7.33" y="5" width="4" height="14" rx="1"/>
                    <rect x="12.67" y="5" width="4" height="14" rx="1"/>
                    <rect x="18" y="5" width="4" height="14" rx="1"/>
                </svg>
                <svg class="icon view-icon view-icon-day" viewBox="0 0 24 24" width="18" height="18"
                     fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <rect x="7" y="3" width="10" height="18" rx="1.5"/>
                </svg>
            </button>

            <button class="btn btn-icon" id="themeBtn" type="button"
                    data-theme-current="dark" aria-label="Сменить тему">
                <svg class="icon theme-icon theme-icon-sun" viewBox="0 0 24 24" width="18" height="18"
                     fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <circle cx="12" cy="12" r="4"/>
                    <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
                </svg>
                <svg class="icon theme-icon theme-icon-moon" viewBox="0 0 24 24" width="18" height="18"
                     fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                </svg>
            </button>
        </div>

        <div class="updated-wrap" id="updatedWrap">
            <button class="btn updated-btn" id="updatedBtn" type="button" aria-label="Обновлено">
                <span class="updated-prefix">Обновлено:</span>
                <svg class="icon" viewBox="0 0 24 24" width="16" height="16"
                     fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
                    <path d="M3 3v5h5"/>
                    <path d="M12 7v5l4 2"/>
                </svg>
                <span id="updatedTime">—</span>
            </button>
            <span class="updated-sub" id="updatedSub" hidden>Вы просматриваете старую версию</span>
        </div>
    </header>

    <main class="calendar" id="calendar"></main>

    <footer class="footer">
        <a class="footer-link" id="githubLink" href="https://github.com/justvladcreate/pspu-schedule-calendar" target="_blank" rel="noopener">
            Исходный код на GitHub
        </a>
    </footer>
</div>

<div class="popover" id="eventPopover"></div>

<div class="modal-backdrop" id="dateModal">
    <div class="picker" role="dialog">
        <div class="picker-header">
            <button class="btn" id="pickerPrev" type="button">‹</button>
            <div class="picker-title" id="pickerTitle"></div>
            <button class="btn" id="pickerNext" type="button">›</button>
        </div>
        <div class="picker-weekdays">
            <div>Пн</div><div>Вт</div><div>Ср</div><div>Чт</div><div>Пт</div><div>Сб</div><div>Вс</div>
        </div>
        <div class="picker-grid" id="pickerGrid"></div>
    </div>
</div>

<div class="modal-backdrop" id="readmeModal">
    <div class="readme" role="dialog" aria-labelledby="readmeTitle">
        <div class="readme-header">
            <h2 class="readme-title" id="readmeTitle">О расписании</h2>
            <button class="readme-close" type="button" aria-label="Закрыть">✕</button>
        </div>
        <div class="readme-body" id="readmeBody">
            <div class="readme-loading">Загрузка…</div>
        </div>
    </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="app.js"></script>
</body>
</html>
