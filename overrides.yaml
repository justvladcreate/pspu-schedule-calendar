#  Матчинг — что можно использовать
#  Ключ	                    Что матчит	                    Пример
#  event_id	                точно по id	                    "1237_ВТ_7_1"
#  group	                группа	                        "1237"
#  weekday	                день недели	                    "ПН"
#  pair_number	            номер пары	                    3
#  time	                    время начала	                "11:30"
#  discipline	            точное совпадение	            "Операционные системы"
#  discipline_contains  	подстрока                   	"Физическая"
#  type                     тип пары	                    "прак."
#  subgroup	                подгруппа	                    "п/г 1"
#  teacher	                одно точное совпадение teachers	"Щипицын В.Д."
#  teacher_contains       	подстрока в любом из teachers	"щипицын"
# Границы семестра — используются fill_semester.


# Если убрать этот блок, границы возьмутся из min/max дат остальных событий.
semester:
  start: "01.09.2026"
  end:   "18.01.2027"

overrides:
  # Преподаватель отменил пару на весь семестр ---
#  - match:
#      time: "09:45"
#      discipline_contains: "Физическая культура"
#    drop: true

  # Физкультура не имеет дат, но должна идти весь семестр ---
  - match:
      not:
        group: "1214"
      discipline_contains: "Физическая культура"
    fill_semester: true

  - match:
      time_start: "11:30"
      discipline_contains: "Операционные системы"
      group: "1237"
    drop: true


