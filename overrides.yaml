#  Ручные правки расписания.
#
#  Все прежние правила удалены: парсер и LLM теперь сами разбираются
#  с датами, аудиториями и повторами. Если понадобится снова — добавьте
#  правило в overrides, синтаксис ниже.
#
#  Матчинг — что можно использовать
#  Ключ	                    Что матчит	                    Пример
#  event_id	                точно по id	                    "1237_ВТ_7_1"
#  group	                группа	                        "1237"
#  weekday	                день недели	                    "ПН"
#  pair_number	            номер пары	                    3
#  time	                    время начала	                "11:30"
#  discipline	            точное совпадение	            "Операционные системы"
#  discipline_contains  	подстрока                   	"Физическая"
#  type                     тип пары	                    "прак."
#  subgroup	                подгруппа	                    "п/г 1"
#  teacher	                одно точное совпадение teachers	"Щипицын В.Д."
#  teacher_contains       	подстрока в любом из teachers	"щипицын"
#
#  Операции: drop, dates, fill_semester, time_start/time_end, rooms,
#  teachers, type, subgroup, discipline, comment.
#
#  # Примеры:
#  - match:
#      group: "1237"
#      discipline_contains: "Физическая"
#    drop: true
#
#  - match:
#      event_id: "1237_ПН_2_1"
#    dates: "07.09.2026 - 21.12.2026"

overrides: []
